<template>
  <article class="card">
    <header class="card-header">
      <lightning-icon
        icon-name="utility:connected_apps"
        size="small"
        class="header-icon">
      </lightning-icon>
      <h2 class="card-title">Suggested Matched Prospect</h2>
    </header>

    <div class="card-body">
      <template for:each={rows} for:item="row">
        <div key={row.key} class="match-row">
          <span class={row.badgeClass}>
            <lightning-icon
              icon-name={row.icon}
              variant={row.variant}
              size="x-small">
            </lightning-icon>
          </span>
          <div class="row-text">
            <span class="row-label">{row.label}</span>
            <span class="row-value">{row.value}</span>
          </div>
        </div>
      </template>
    </div>

    <footer class="card-footer">
      <button
        type="button"
        class="slds-button slds-button_brand primary-btn"
        onclick={handleConfirm}>
        Confirm &amp; create contribution
      </button>
      <div class="secondary-row">
        <button
          type="button"
          class="slds-button slds-button_neutral secondary-btn"
          onclick={handlePartialPayment}>
          Record partial payment
        </button>
        <button
          type="button"
          class="slds-button slds-button_neutral secondary-btn"
          onclick={handleContactInvestor}>
          Contact investor
        </button>
      </div>
    </footer>
  </article>
</template>
