<template>
  <article class="card">
    <header class="card-header">
      <lightning-icon
        icon-name="utility:search"
        size="small"
        class="header-icon">
      </lightning-icon>
      <h2 class="card-title">Investigate &ndash; Identify the prospect linked to this wire</h2>
    </header>

    <div class="search-bar">
      <lightning-input
        type="search"
        label="Search prospects"
        variant="label-hidden"
        placeholder="Search name or investing entity..."
        value={searchTerm}
        onchange={handleSearchChange}
        class="search-input">
      </lightning-input>
      <lightning-button
        label="Search"
        variant="neutral"
        onclick={handleSearch}
        class="search-btn">
      </lightning-button>
    </div>

    <ul class="list">
      <template for:each={rows} for:item="row">
        <li key={row.id} class={row.rowClass}>
          <div class="row-avatar">
            <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
          </div>

          <div class="row-main">
            <p class="row-name">{row.name}</p>
            <p class="row-entity">
              <lightning-icon icon-name="utility:company" size="xx-small" class="row-entity-icon"></lightning-icon>
              <span>{row.entity}</span>
            </p>
          </div>

          <div class="row-commitment">
            <span class="row-commitment-label">Commitment</span>
            <span class="row-commitment-value">{row.commitment}</span>
          </div>

          <div class="row-score">
            <span class="row-score-label">Match</span>
            <span class={row.scoreClass}>{row.scoreLabel}</span>
          </div>

          <div class="row-action">
            <lightning-button
              label={row.buttonLabel}
              variant={row.buttonVariant}
              icon-name={row.buttonIcon}
              data-id={row.id}
              onclick={handleSelect}
              class="select-btn">
            </lightning-button>
          </div>
        </li>
      </template>

      <template lwc:if={hasNoRows}>
        <li class="empty">No prospects match your search.</li>
      </template>
    </ul>

    <footer class="card-footer">
      <lightning-button-group>
        <lightning-button
          label="Select &amp; Verify"
          variant="brand"
          icon-name="utility:check"
          onclick={handleVerify}>
        </lightning-button>
        <lightning-button
          label="No Match"
          icon-name="utility:close"
          onclick={handleNoMatch}>
        </lightning-button>
      </lightning-button-group>
    </footer>
  </article>
</template>
