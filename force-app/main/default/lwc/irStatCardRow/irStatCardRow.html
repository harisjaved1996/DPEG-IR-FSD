<template>
    <div class="slds-grid slds-gutters slds-wrap">
        <template for:each={stats} for:item="stat">
            <div key={stat.key} class="slds-col slds-size_1-of-4">
                <c-kpi-card
                    value={stat.value}
                    label={stat.label}
                    value-color={stat.valueColor}
                ></c-kpi-card>
            </div>
        </template>
    </div>
</template>
